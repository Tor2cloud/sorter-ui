<!doctype html>
<html lang="en"><head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tor2cloud Sorter</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;background:#0d1117;color:#e6edf3;font:16px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;padding:16px;max-width:640px;margin:0 auto}
  h1{font-size:20px;margin:8px 0 16px}
  label{display:block;font-size:13px;color:#8b949e;margin:14px 0 4px}
  input,select{width:100%;padding:12px;border-radius:8px;border:1px solid #30363d;background:#161b22;color:#e6edf3;font-size:16px}
  button{width:100%;margin-top:16px;padding:14px;border:0;border-radius:8px;background:#238636;color:#fff;font-size:17px;font-weight:600}
  button:disabled{background:#21262d;color:#8b949e}
  .job{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:12px;margin-top:12px}
  .job a{color:#58a6ff;word-break:break-all;text-decoration:none;font-size:15px}
  .bar{height:10px;background:#21262d;border-radius:5px;margin-top:8px;overflow:hidden}
  .bar>div{height:100%;background:#2ea043;transition:width .5s}
  .meta{font-size:13px;color:#8b949e;margin-top:6px;white-space:pre-wrap}
  .failed .bar>div{background:#f85149}
  .done .bar>div{background:#a371f7}
  #msg{margin-top:12px;font-size:14px;color:#3fb950;white-space:pre-wrap}
  #msg.err{color:#f85149}
  h2{font-size:15px;color:#8b949e;margin:24px 0 4px}
  #gate{max-width:360px;margin:18vh auto 0}
  #gate .err{color:#f85149;font-size:14px;margin-top:10px;min-height:20px}
  #app{display:none}
  .tl{margin-top:8px;border-left:2px solid #30363d;padding-left:10px}
  .tl div{font-size:13px;color:#c9d1d9;margin:3px 0;white-space:pre-wrap}
  .tl .t{color:#8b949e;font-size:12px;margin-right:6px}
  .tl .warn{color:#f0883e}
  #quota{font-size:12px;color:#8b949e;margin-top:-8px;margin-bottom:10px}
  .chips{display:flex;gap:6px;margin:24px 0 4px}
  .chips button{flex:1;margin-top:0;padding:8px;border-radius:6px;background:#21262d;color:#8b949e;font-size:13px;font-weight:600;border:1px solid #30363d}
  .chips button.on{background:#1f6feb;color:#fff;border-color:#1f6feb}
  .thumb{width:64px;height:64px;object-fit:cover;border-radius:6px;margin-top:8px;display:block}
</style></head><body>

<div id="gate">
  <h1>&#8675; Tor2cloud Sorter</h1>
  <label for="pw">Passcode</label>
  <input id="pw" type="password" placeholder="Required" autocomplete="off">
  <button id="unlock" onclick="unlock()">Unlock</button>
  <div class="err" id="gateerr"></div>
</div>

<div id="app">
  <h1>&#8675; Tor2cloud Sorter</h1>
  <div id="quota"></div>
  <label for="link">Magnet / .torrent / direct video link</label>
  <input id="link" type="url" placeholder="magnet:?xt=... or https://..." autocomplete="off">
  <label for="cat">Category (FileLu folder)</label>
  <select id="cat">
    <option>Movies/English</option>
    <option>Movies/Tamil</option>
    <option>Movies/Malayalam</option>
    <option>Apps/Linux</option>
    <option value="__custom">Custom...</option>
  </select>
  <input id="catcustom" type="text" placeholder="Custom folder, e.g. Movies/Telugu" style="display:none;margin-top:8px">
  <button id="go" onclick="submitJob()">Start download</button>
  <div id="msg"></div>
  <div class="chips">
    <button data-f="active" class="on" onclick="setFilter('active',this)">Active</button>
    <button data-f="stalled" onclick="setFilter('stalled',this)">Stalled</button>
    <button data-f="done" onclick="setFilter('done',this)">Done</button>
    <button data-f="failed" onclick="setFilter('failed',this)">Failed</button>
  </div>
  <div id="jobs">loading...</div>
</div>

<script>
const API='https://tor2cloud-sorter.divyaprabandam.workers.dev';
function hdr(){return {'x-ui-passcode':(localStorage.getItem('t2c_pw')||'')};}
let curFilter='active';
function setFilter(f,btn){
  curFilter=f;
  document.querySelectorAll('.chips button').forEach(b=>b.classList.toggle('on',b===btn));
  loadJobs();
}
async function loadQuota(){
  try{
    const r=await fetch(API+'/api/quota',{headers:hdr()});
    if(!r.ok)return;
    const q=await r.json();
    if(q.storage_used!=null)document.getElementById('quota').textContent='FileLu: '+q.storage_used+' / '+q.storage+' GB used';
  }catch(e){}
}
async function unlock(){
  const pw=document.getElementById('pw').value.trim();
  const err=document.getElementById('gateerr');
  if(!pw){err.textContent='Enter the passcode.';return;}
  document.getElementById('unlock').disabled=true;
  err.textContent='Checking...';
  try{
    const r=await fetch(API+'/api/jobs',{headers:{'x-ui-passcode':pw}});
    if(r.status===401){err.textContent='Wrong passcode.';document.getElementById('unlock').disabled=false;return;}
    if(!r.ok)throw new Error('API '+r.status);
    localStorage.setItem('t2c_pw',pw);
    document.getElementById('gate').style.display='none';
    document.getElementById('app').style.display='block';
    renderJobs(await r.json());
    loadQuota(); setInterval(loadQuota,300000);
    setInterval(loadJobs,10000);
  }catch(e){err.textContent='Cannot reach the service. Try again.';document.getElementById('unlock').disabled=false;}
}
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')unlock();});
const saved=localStorage.getItem('t2c_pw');
if(saved){document.getElementById('pw').value=saved;unlock();}
const sel=document.getElementById('cat'),cust=document.getElementById('catcustom');
sel.onchange=()=>{cust.style.display=sel.value==='__custom'?'block':'none';};
function cat(){return sel.value==='__custom'?(cust.value.trim()||'Movies/English'):sel.value;}
async function submitJob(){
  const link=document.getElementById('link').value.trim();
  const msg=document.getElementById('msg');
  if(!link){msg.className='err';msg.textContent='Paste a link first.';return;}
  document.getElementById('go').disabled=true;
  msg.className='';msg.textContent='Starting...';
  try{
    const r=await fetch(API+'/api/new',{method:'POST',headers:{'content-type':'application/json',...hdr()},body:JSON.stringify({link,category:cat()})});
    const j=await r.json();
    if(r.status===401){lockOut();return;}
    if(!r.ok)throw new Error(j.error||r.status);
    msg.textContent='Started. Track it here or on the issue: '+j.issue_url;
    document.getElementById('link').value='';
    loadJobs();
  }catch(e){msg.className='err';msg.textContent='Failed: '+e.message;}
  document.getElementById('go').disabled=false;
}
function lockOut(){
  localStorage.removeItem('t2c_pw');
  document.getElementById('app').style.display='none';
  document.getElementById('gate').style.display='block';
  document.getElementById('gateerr').textContent='Session expired - enter the passcode again.';
}
function bar(pct){
  pct=Math.max(0,Math.min(100,pct|0));
  return '<div class="bar"><div style="width:'+pct+'%"></div></div>';
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function fmt(ts){
  try{return new Date(ts).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});}catch(e){return '';}
}
function timeline(tl){
  if(!tl||!tl.length)return '';
  return '<div class="tl">'+tl.map(function(e){
    const warn=/fail|warn|stall|error/i.test(e.text)?' warn':'';
    return '<div class="'+warn.trim()+'"><span class="t">'+fmt(e.ts)+'</span>'+esc(e.text)+'</div>';
  }).join('')+'</div>';
}
function renderJobs(j){
  const box=document.getElementById('jobs');
  if(!j.length){box.innerHTML='<div class="meta">'+(curFilter==='active'?'No active jobs. Paste a link above to start one.':'No '+curFilter+' jobs.')+'</div>';return;}
  box.innerHTML=j.map(function(x){
    return '<div class="job '+x.state+'"><a href="'+x.url+'">'+esc(x.title)+'</a>'
      +bar(x.pct)+(x.thumb?'<img class="thumb" src="'+x.thumb+'" alt="">':'')
      +timeline(x.timeline)+'</div>';
  }).join('');
}
async function loadJobs(){
  try{
    const r=await fetch(API+'/api/jobs?filter='+curFilter,{headers:hdr()});
    if(r.status===401){lockOut();return;}
    renderJobs(await r.json());
  }catch(e){/* keep last render on transient errors */}
}
</script></body></html>
