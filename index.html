<!doctype html>
<html lang="en"><head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tor2cloud Sorter</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;background:#0d1117;color:#e6edf3;font:16px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;padding:16px;max-width:640px;margin:0 auto}
  h1{font-size:20px;margin:8px 0 16px}
  label{display:block;font-size:13px;color:#8b949e;margin:14px 0 4px}
  input,select{width:100%;padding:12px;border-radius:8px;border:1px solid #30363d;background:#161b22;color:#e6edf3;font-size:16px}
  button{width:100%;margin-top:16px;padding:14px;border:0;border-radius:8px;background:#238636;color:#fff;font-size:17px;font-weight:600}
  button:disabled{background:#21262d;color:#8b949e}
  .job{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:12px;margin-top:12px}
  .job a{color:#58a6ff;word-break:break-all;text-decoration:none;font-size:15px}
  .bar{height:10px;background:#21262d;border-radius:5px;margin-top:8px;overflow:hidden}
  .bar>div{height:100%;background:#2ea043;transition:width .5s}
  .meta{font-size:13px;color:#8b949e;margin-top:6px;white-space:pre-wrap}
  .failed .bar>div{background:#f85149}
  .done .bar>div{background:#a371f7}
  #msg{margin-top:12px;font-size:14px;color:#3fb950;white-space:pre-wrap}
  #msg.err{color:#f85149}
  h2{font-size:15px;color:#8b949e;margin:24px 0 4px}
  #gate{max-width:360px;margin:18vh auto 0}
  #gate .err{color:#f85149;font-size:14px;margin-top:10px;min-height:20px}
  #app{display:none}
  .tl{margin-top:8px;border-left:2px solid #30363d;padding-left:10px}
  .tl div{font-size:13px;color:#c9d1d9;margin:3px 0;white-space:pre-wrap}
  .tl .t{color:#8b949e;font-size:12px;margin-right:6px}
  .tl .warn{color:#f0883e}
  #quota{font-size:12px;color:#8b949e;margin-top:-8px;margin-bottom:10px}
  .chips{display:flex;gap:6px;margin:24px 0 4px}
  .chips button{flex:1;margin-top:0;padding:8px;border-radius:6px;background:#21262d;color:#8b949e;font-size:13px;font-weight:600;border:1px solid #30363d}
  .chips button.on{background:#1f6feb;color:#fff;border-color:#1f6feb}
  #seedr{font-size:13px;margin:-4px 0 10px;padding:8px 10px;border-radius:8px;border:1px solid #30363d}
  #seedr.ok{color:#3fb950;border-color:#1f6feb33}
  #seedr.bad{color:#f85149;border-color:#f8514955}
  #seedr.warn{color:#f0883e}
  #seedr a{color:#58a6ff;float:right}
  #seedrbox{margin-top:8px}
  #seedrbox textarea{width:100%;padding:10px;border-radius:8px;border:1px solid #30363d;background:#161b22;color:#e6edf3;font-size:13px;font-family:monospace;resize:vertical}
  #seedrmsg{font-size:13px;margin-top:6px;min-height:16px}
  #seedrmsg.ok{color:#3fb950}
  #seedrmsg.err{color:#f85149}
  .thumb{width:64px;height:64px;object-fit:cover;border-radius:6px;margin-top:8px;display:block}
  .steps{margin-top:8px}
  .step{font-size:13px;color:#6e7681;margin:2px 0}
  .step.done{color:#3fb950}
  .step.cur{color:#e6edf3;font-weight:600}
  .step .m{display:inline-block;width:16px}
  .openbtn{display:block;margin-top:10px;padding:12px;background:#238636;color:#fff;border-radius:8px;text-align:center;font-weight:600;text-decoration:none;font-size:15px}
  .heldline{font-size:13px;color:#d29922;margin-top:8px;font-weight:600}
</style></head><body>

<div id="gate">
  <h1>&#8675; Tor2cloud Sorter</h1>
  <label for="pw">Passcode</label>
  <input id="pw" type="password" placeholder="Required" autocomplete="off">
  <button id="unlock" onclick="unlock()">Unlock</button>
  <div class="err" id="gateerr"></div>
</div>

<div id="app">
  <h1>&#8675; Tor2cloud Sorter</h1>
  <div id="quota"></div>
  <div id="seedr" class="warn">Seedr: checking...<a href="#" onclick="toggleSeedr();return false" id="seedrtoggle" style="display:none">refresh session</a></div>
  <div id="seedrbox" style="display:none">
    <textarea id="seedrcookie" rows="3" placeholder="Paste the cookie header from a logged-in seedr.cc tab: F12 -> Network -> click any /api request -> Headers -> Request Headers -> copy the whole cookie: value"></textarea>
    <button id="seedrsave" onclick="saveSeedr()" style="margin-top:8px;padding:10px">Save Seedr session</button>
    <div id="seedrmsg"></div>
  </div>
  <label for="link">Links - one per line (magnet / .torrent / direct). Mix freely - each line routes itself.</label>
  <textarea id="link" rows="4" placeholder="magnet:?xt=...&#10;https://site.com/file.torrent&#10;https://cdn.com/movie.mp4" style="width:100%;padding:12px;border-radius:8px;border:1px solid #30363d;background:#161b22;color:#e6edf3;font-size:15px;font-family:monospace;resize:vertical"></textarea>
  <div id="drop" onclick="document.getElementById('tfiles').click()" style="margin-top:10px;padding:14px;border:1px dashed #30363d;border-radius:8px;text-align:center;color:#8b949e;font-size:14px;cursor:pointer">
    Or drop .torrent files here / tap to choose - they queue exactly like a .torrent link.
    <span id="dropnames" style="display:block;color:#e6edf3;margin-top:4px"></span>
  </div>
  <input id="tfiles" type="file" accept=".torrent" multiple style="display:none" onchange="filesPicked(this.files)">
  <label for="cat">Category (FileLu folder)</label>
  <select id="cat">
    <option>Movies/English</option>
    <option>Movies/Tamil</option>
    <option>Movies/Malayalam</option>
    <option>Apps/Linux</option>
    <option value="__custom">Custom...</option>
  </select>
  <input id="catcustom" type="text" placeholder="Custom folder, e.g. Movies/Telugu" style="display:none;margin-top:8px">
  <button id="go" onclick="submitJob()">Start download</button>
  <div id="msg"></div>
  <div class="chips">
    <button data-f="active" class="on" onclick="setFilter('active',this)">Active</button>
    <button data-f="stalled" onclick="setFilter('stalled',this)">Stalled</button>
    <button data-f="done" onclick="setFilter('done',this)">Done</button>
    <button data-f="failed" onclick="setFilter('failed',this)">Failed</button>
  </div>
  <div id="jobs">loading...</div>
</div>

<script>
const API='https://tor2cloud-sorter.divyaprabandam.workers.dev';

let seedrState='unknown';
let pickedFiles=[];
function filesPicked(list){
  pickedFiles=Array.from(list||[]).filter(function(f){return /\.torrent$/i.test(f.name);}).slice(0,10);
  const dn=document.getElementById('dropnames');
  dn.textContent=pickedFiles.length?('Queued: '+pickedFiles.map(function(f){return f.name;}).join(', ')):'';
}
function readB64(f){
  return new Promise(function(res,rej){
    const r=new FileReader();
    r.onload=function(){res(String(r.result).split(',')[1]);};
    r.onerror=rej;
    r.readAsDataURL(f);
  });
}
window.addEventListener('DOMContentLoaded',function(){
  const dz=document.getElementById('drop');
  if(!dz)return;
  ['dragover','dragenter'].forEach(function(ev){dz.addEventListener(ev,function(e){e.preventDefault();dz.style.borderColor='#58a6ff';});});
  ['dragleave','drop'].forEach(function(ev){dz.addEventListener(ev,function(e){e.preventDefault();dz.style.borderColor='#30363d';});});
  dz.addEventListener('drop',function(e){filesPicked(e.dataTransfer.files);});
});
async function seedrHealth(){
  const el=document.getElementById('seedr');
  try{
    const r=await fetch(API+'/api/seedr-health',{headers:hdr()});
    const d=await r.json();
    seedrState=d.state;
    if(d.state==='logged_in'){
      el.className='ok';
      el.firstChild.textContent='Seedr: logged in - '+fmtGB(d.used_bytes)+' / '+fmtGB(d.total_bytes)+' used';
      document.getElementById('seedrbox').style.display='none';
      document.getElementById('seedrtoggle').style.display='inline';
    }else if(d.state==='requires_login'){
      el.className='bad';
      el.firstChild.textContent='Seedr: requires login - paste a fresh cookie below to refresh the session';
      document.getElementById('seedrbox').style.display='block';
      document.getElementById('seedrtoggle').style.display='none';
    }else{
      el.className='warn';
      el.firstChild.textContent='Seedr: unreachable - will retry';
    }
  }catch(e){ seedrState='unknown'; el.className='warn'; el.firstChild.textContent='Seedr: status error'; }
}
function fmtGB(b){ return (b/1073741824).toFixed(2)+' GB'; }
function toggleSeedr(){
  const b=document.getElementById('seedrbox');
  b.style.display = b.style.display==='none' ? 'block' : 'none';
}
async function saveSeedr(){
  const m=document.getElementById('seedrmsg');
  const cookie=document.getElementById('seedrcookie').value.trim();
  if(!cookie){ m.className='err'; m.textContent='Paste the cookie first.'; return; }
  m.className=''; m.textContent='Checking against Seedr...';
  document.getElementById('seedrsave').disabled=true;
  try{
    const r=await fetch(API+'/api/seedr-session',{method:'POST',headers:{'content-type':'application/json',...hdr()},body:JSON.stringify({cookie})});
    const d=await r.json();
    if(r.ok&&d.ok){
      const gh=d.gh_secret||{};
      m.className='ok';
      m.textContent='Session saved - Seedr is logged in.' + (gh.ok?' CI secret installed - downloads can run.':(gh.skipped?'':' (warning: CI secret install failed - tell Prasanna)'));
      document.getElementById('seedrcookie').value='';
      seedrHealth();
    }else{
      m.className='err'; m.textContent=d.hint||d.error||('Not accepted: '+r.status);
    }
  }catch(e){ m.className='err'; m.textContent='save error: '+e.message; }
  document.getElementById('seedrsave').disabled=false;
}
function hdr(){return {'x-ui-passcode':(localStorage.getItem('t2c_pw')||'')};}
let curFilter='active';
function setFilter(f,btn){
  curFilter=f;
  document.querySelectorAll('.chips button').forEach(b=>b.classList.toggle('on',b===btn));
  loadJobs();
}
async function loadQuota(){
  try{
    const r=await fetch(API+'/api/quota',{headers:hdr()});
    if(!r.ok)return;
    const q=await r.json();
    if(q.storage_used!=null)document.getElementById('quota').textContent='FileLu: '+q.storage_used+' / '+q.storage+' GB used';
  }catch(e){}
}
async function unlock(){
  const pw=document.getElementById('pw').value.trim();
  const err=document.getElementById('gateerr');
  if(!pw){err.textContent='Enter the passcode.';return;}
  document.getElementById('unlock').disabled=true;
  err.textContent='Checking...';
  try{
    const r=await fetch(API+'/api/jobs',{headers:{'x-ui-passcode':pw}});
    if(r.status===401){err.textContent='Wrong passcode.';document.getElementById('unlock').disabled=false;return;}
    if(!r.ok)throw new Error('API '+r.status);
    localStorage.setItem('t2c_pw',pw);
    seedrHealth();
    document.getElementById('gate').style.display='none';
    document.getElementById('app').style.display='block';
    renderJobs(await r.json());
    loadQuota(); setInterval(loadQuota,300000);
    setInterval(loadJobs,10000);
  }catch(e){err.textContent='Cannot reach the service. Try again.';document.getElementById('unlock').disabled=false;}
}
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')unlock();});
const saved=localStorage.getItem('t2c_pw');
if(saved){document.getElementById('pw').value=saved;unlock();}
const sel=document.getElementById('cat'),cust=document.getElementById('catcustom');
sel.onchange=()=>{cust.style.display=sel.value==='__custom'?'block':'none';};
function cat(){return sel.value==='__custom'?(cust.value.trim()||'Movies/English'):sel.value;}
async function submitJob(){
  if(seedrState==='requires_login'){
    const m=document.getElementById('msg');
    m.className='err';
    m.textContent='Seedr session is dead - jobs would fail. Refresh the session above first.';
    return;
  }
  const link=document.getElementById('link').value.trim();
  const msg=document.getElementById('msg');
  if(!link&&!pickedFiles.length){msg.className='err';msg.textContent='Paste a link or drop a .torrent file first.';return;}
  document.getElementById('go').disabled=true;
  msg.className='';msg.textContent='Starting...';
  try{
    const files=[];
    for(const f of pickedFiles){files.push({name:f.name,b64:await readB64(f)});}
    const r=await fetch(API+'/api/new',{method:'POST',headers:{'content-type':'application/json',...hdr()},body:JSON.stringify({link,category:cat(),files})});
    const j=await r.json();
    if(r.status===401){lockOut();return;}
    if(!r.ok)throw new Error(j.error||r.status);
    if(j.created&&j.created.length>1){msg.textContent='Started '+j.created.length+' jobs: '+j.created.map(function(c){return '#'+c.number;}).join(', ')+'. Track them below.';}
    else{msg.textContent='Started. Track it here or on the issue: '+j.issue_url;}
    document.getElementById('link').value='';
    pickedFiles=[];document.getElementById('dropnames').textContent='';
    document.getElementById('tfiles').value='';
    loadJobs();
  }catch(e){msg.className='err';msg.textContent='Failed: '+e.message;}
  document.getElementById('go').disabled=false;
}
function lockOut(){
  localStorage.removeItem('t2c_pw');
  document.getElementById('app').style.display='none';
  document.getElementById('gate').style.display='block';
  document.getElementById('gateerr').textContent='Session expired - enter the passcode again.';
}
function bar(pct){
  pct=Math.max(0,Math.min(100,pct|0));
  return '<div class="bar"><div style="width:'+pct+'%"></div></div>';
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function fmt(ts){
  try{return new Date(ts).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});}catch(e){return '';}
}
function timeline(tl){
  if(!tl||!tl.length)return '';
  return '<div class="tl">'+tl.map(function(e){
    const warn=/fail|warn|stall|error/i.test(e.text)?' warn':'';
    return '<div class="'+warn.trim()+'"><span class="t">'+fmt(e.ts)+'</span>'+esc(e.text)+'</div>';
  }).join('')+'</div>';
}
function stepper(x){
  const tl=x.timeline||[];
  const has=function(st){return tl.some(function(e){return e.stage===st;});};
  const st=x.status||'';
  const direct=/fetching directly/i.test(st)||tl.some(function(e){return /fetching directly/i.test(e.text||'');});
  const ready=has('ready')||x.state==='done';
  const readyEntry=tl.filter(function(e){return e.stage==='ready';}).pop();
  let readyUrl=null;
  if(readyEntry){const m=/(https?:\/\/\S+)/.exec(readyEntry.text||'');if(m)readyUrl=m[1];}
  if(x.state==='held'){
    return '<div class="heldline">Waiting for space - will start itself</div>'
      +'<div class="steps"><div class="step done"><span class="m">&#10003;</span>Added to queue</div></div>';
  }
  const downloading=/Seedr downloading/.test(st);
  const fetching=/FileLu fetching/.test(st);
  const dlDone=has('download-complete')||fetching||ready;
  const pctTxt=(x.pct>0&&x.pct<100)?' - '+x.pct+'%':'';
  function cls(done,cur){return done?'done':(cur?'cur':'');}
  function mk(done,cur){return done?'&#10003;':(cur?'&#9656;':'&#183;');}
  const out=[];
  function push(label,done,cur){out.push('<div class="step '+cls(done,cur)+'"><span class="m">'+mk(done,cur)+'</span>'+label+'</div>');}
  if(!direct){
    push('Connected to Seedr', has('login')||dlDone||downloading, false);
  }
  push('Added to queue', true, false);
  if(!direct){
    push('Downloading'+ (downloading?pctTxt:''), dlDone, downloading&&!dlDone);
  }
  push('Saving to FileLu'+(fetching?pctTxt:''), ready||(fetching&&x.pct>=100), fetching&&x.pct<100);
  push('Verifying', ready, fetching&&x.pct>=100&&!ready);
  if(!direct){
    push('Cleaning up', has('seedr-deleted')||ready, false);
  }
  push('Ready - tap to open', ready, false);
  let html='<div class="steps">'+out.join('')+'</div>';
  if(ready&&readyUrl){html+='<a class="openbtn" href="'+readyUrl+'" target="_blank" rel="noopener">Ready - tap to open</a>';}
  return html;
}
function renderJobs(j){
  const box=document.getElementById('jobs');
  if(!j.length){box.innerHTML='<div class="meta">'+(curFilter==='active'?'No active jobs. Paste a link above to start one.':'No '+curFilter+' jobs.')+'</div>';return;}
  box.innerHTML=j.map(function(x){
    return '<div class="job '+x.state+'"><a href="'+x.url+'">'+esc(x.title)+'</a>'
      +bar(x.pct)+(x.thumb?'<img class="thumb" src="'+x.thumb+'" alt="">':'')
      +stepper(x)+timeline(x.timeline)+'</div>';
  }).join('');
}
async function loadJobs(){
  try{
    const r=await fetch(API+'/api/jobs?filter='+curFilter,{headers:hdr()});
    if(r.status===401){lockOut();return;}
    renderJobs(await r.json());
  }catch(e){/* keep last render on transient errors */}
}
</script></body></html>
